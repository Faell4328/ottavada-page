<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/avif" href="/logo.avif"><title>Ottavada: Vielen Dank</title><meta name="description" content="Vielen Dank für Ihr Interesse an Ottavada."><script>
      (function () {
        var STORAGE_KEY = "ottavada-lang";
        var SUPPORTED = ["en", "pt-BR", "es", "fr", "it", "de"];
        function isSupported(v) { return v && SUPPORTED.indexOf(v) !== -1; }
        function readStored() { try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; } }
        function browserLocale() {
          var raw = (navigator.language || "").replace("_", "-");
          if (isSupported(raw)) return raw;
          var prefix = raw.split("-")[0];
          for (var i = 0; i < SUPPORTED.length; i++) {
            if (SUPPORTED[i].split("-")[0] === prefix) return SUPPORTED[i];
          }
          return null;
        }
        var segments = window.location.pathname.split("/").filter(Boolean);
        var currentLocale = segments[0] && isSupported(segments[0]) ? segments[0] : null;
        if (currentLocale) {
          try { localStorage.setItem(STORAGE_KEY, currentLocale); } catch (e) {}
          return;
        }
        var params = new URLSearchParams(window.location.search);
        if (params.has("lang")) return;
        var stored = readStored();
        var target = isSupported(stored) ? stored : browserLocale();
        if (!target) return;
        var rest = "/" + segments.join("/");
        var cleanRest = rest === "/" ? "" : rest;
        try { localStorage.setItem(STORAGE_KEY, target); } catch (e) {}
        window.location.replace("/" + target + cleanRest + window.location.search + window.location.hash);
      })();
    </script><link rel="stylesheet" href="/_astro/_page_.CLoApDCP.css"><link rel="stylesheet" href="/_astro/BaseLayout.cEly3-g1.css"></head><body><main class="thanks-layout"><div class="container" style="max-width: 56rem"><div class="thanks-card"><div><h1>Vielen Dank für Ihr Interesse an dem Tool!</h1><p class="countdown-text" id="thanks-countdown">Sie werden in 5 Sekunden zur Dokumentation weitergeleitet...</p></div><div class="thanks-video-wrap"><video src="/files/agradecimento.mp4" autoplay muted playsinline preload="auto"></video></div></div></div></main><script>(function(){const countdownTpl = "Sie werden in {seconds} Sekunden zur Dokumentation weitergeleitet...";
const docsHref = "/de/docs/";
const linuxUrl = "https://github.com/Faell4328/ottavada/releases/download/v1.3/Linux_Ottavada_x64.AppImage";
const macUrl = "https://github.com/Faell4328/ottavada/releases/download/v1.3/Mac_Ottavada_universal.dmg";

    (function () {
      const ua = (navigator.userAgent || "") + (navigator.platform || "");
      const isWindows = /windows|win32|win64/i.test(ua);
      const isMac = !isWindows && /mac|darwin/i.test(ua);

      let downloadUrl;
      let downloadName;
      if (isWindows) {
        downloadUrl = "/ottavada.cmd";
        downloadName = "ottavada.cmd";
      } else if (isMac) {
        downloadUrl = macUrl;
      } else {
        downloadUrl = linuxUrl;
      }

      const downloadLink = document.createElement("a");
      downloadLink.href = downloadUrl;
      if (downloadName) downloadLink.download = downloadName;
      downloadLink.style.display = "none";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      let seconds = 5;
      const countdownEl = document.getElementById("thanks-countdown");
      const timerId = setInterval(() => {
        seconds -= 1;
        if (seconds <= 0) {
          clearInterval(timerId);
          window.location.href = docsHref;
          return;
        }
        if (countdownEl) {
          countdownEl.textContent = countdownTpl.replace("{seconds}", String(seconds));
        }
      }, 1000);
    })();
  })();</script></body></html>
