<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/avif" href="logo.avif" />
        <title data-i18n="thanks.title">Ottavada &mdash; Obrigado</title>
        <meta
            name="description"
            data-i18n-content="thanks.description"
            content="Obrigado pelo interesse no Ottavada."
        />
        <script src="js/i18n/agradecimento.js"></script>
        <script src="js/i18n/motor.js"></script>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="agradecimento.css" />
    </head>
    <body>
        <main class="thanks-layout">
            <div class="container" style="max-width: 56rem">
                <div class="thanks-card">
                    <div>
                        <h1 data-i18n="thanks.heading">Obrigado pelo interesse na ferramenta!</h1>
                        <p class="countdown-text" id="thanks-countdown">
                            Você será redirecionado à página inicial em 5
                            segundos...
                        </p>
                    </div>
                    <div class="thanks-video-wrap">
                        <video
                            src="files/agradecimento.mp4"
                            autoplay
                            muted
                            playsinline
                            preload="auto"
                        ></video>
                    </div>
                </div>
            </div>
        </main>

        <script>
            (function () {
                "use strict";

                var downloadFrame = document.createElement("iframe");
                downloadFrame.style.display = "none";
                downloadFrame.src =
                    "https://ottavada.rhafaell.com.br/v1/download";
                document.body.appendChild(downloadFrame);
                setTimeout(function () {
                    if (downloadFrame.parentNode) {
                        downloadFrame.parentNode.removeChild(downloadFrame);
                    }
                }, 5000);

                var seconds = 5;
                var countdownEl = document.getElementById("thanks-countdown");

                var timerId = setInterval(function () {
                    seconds--;
                    if (seconds <= 0) {
                        clearInterval(timerId);
                        var base = window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/") + 1);
                        window.location.href = base + "?lang=" + window.__i18n.lang;
                        return;
                    }
                    if (countdownEl) {
                        countdownEl.textContent = window.__i18nFormat(
                            window.__i18n.thanks.countdown,
                            { seconds: seconds }
                        );
                    }
                }, 1000);
            })();
        </script>
    </body>
</html>
